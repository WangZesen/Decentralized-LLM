# Reduced AdamW sweep: 4 TPP warmup inside a 60 TPP total budget.
# 20M, context 512, global batch 128, gradient clipping 1.0, no error feedback.
# Start from the confirmed 40 TPP winner; see README.md for 20/40 TPP evidence.
# 42 executions before retries: 9 LR/decay + 21 new betas + 12 confirmation.
# 22 allocations per study with up to two sequential trials per allocation.
base:
  configs:
    - ../base.yaml
    - ../models/20m.yaml
    - ../setups/slurm-decentralized.yaml
  overrides:
    model.context_length: 512
    training.batch_tokens: 65536
    training.tokens_per_parameters: 60.0
    training.num_accumulation: 1
    training.data_reuse_factor: 1
    training.checkpoint_policy: none
    optimizer.name: adamw
    # Confirmed 40 TPP winner; screening searches its LR/decay neighborhood.
    optimizer.lr: 0.015625
    optimizer.weight_decay: 0.05
    optimizer.beta1: 0.974003746425297
    optimizer.beta2: 0.996712898272925
    optimizer.grad_clip: 1.0
    lr_schedule.name: cosine
    lr_schedule.warmup_tokens_per_parameters: 4.0
    lr_schedule.min_lr_ratio: 0.0
    distributed.mode: decentralized
    distributed.nodes: 1
    distributed.gpus_per_node: 4
    distributed.scheme: awc
    distributed.topology: one_peer_exponential
    distributed.error_feedback_gamma: 0.0
    runtime.training_backend: packed
    runtime.execution_backend: gh200
    runtime.compile: auto
    runtime.cpu_affinity: none
    runtime.fused_optimizer: true
    runtime.amp: true
    evaluation.subset_blocks: 1024
    evaluation.batch_size: 256
    evaluation.seed: 12345
    launcher.partition: gpu
    launcher.gpu_type: nvidia_gh200_120gb
    launcher.time: '00:30:00'

seed_start: 42
screening_seeds: 1
phases:
  - name: learning-rate-and-decay
    initial_values:
      optimizer.beta1: 0.974003746425297
      optimizer.beta2: 0.996712898272925
    search:
      # LR: 2^-7, 2^-6, 2^-5.
      optimizer.lr: [0.0078125, 0.015625, 0.03125]
      optimizer.weight_decay: [0.025, 0.05, 0.1]
    top_k: 3
  - name: betas
    search:
      # All 20/40 TPP winners use one of these two beta1 values.
      optimizer.beta1:
        scale: power
        base: 0.9
        exponent_scale: log
        exponent_min: 0.25
        exponent_max: 0.5
        points: 2
      # Exponents: 1/2048, 1/512, 1/128, 1/32.
      optimizer.beta2:
        scale: power
        base: 0.9
        exponent_scale: log
        exponent_min: 0.00048828125
        exponent_max: 0.03125
        points: 4
    top_k: 6
confirmation:
  seeds: 3
controller:
  max_jobs: 25
  jobs_per_allocation: 2
  max_retries: 2
  poll_seconds: 30
