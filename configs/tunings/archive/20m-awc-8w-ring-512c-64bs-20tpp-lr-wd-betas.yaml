# Joint AdamW tuning: 20M, context 512, global batch 64, no error feedback.
# 94 executions before retries: 25 LR/decay + 57 new betas + 12 confirmation.
# At most two of these studies run together: 25 allocations each, 50 total.
base:
  configs:
    - ../../base.yaml
    - ../../models/20m.yaml
    - ../../setups/slurm-decentralized.yaml
    - ../../setups/8gpu-2nodes.yaml
    - ../../training-512c-64bs-20tpp.yaml
  overrides:
    training.num_accumulation: 1
    training.data_reuse_factor: 1
    training.checkpoint_policy: none
    optimizer.name: adamw
    optimizer.grad_clip: 1.0
    lr_schedule.name: cosine
    lr_schedule.warmup_tokens_per_parameters: 1.0
    lr_schedule.min_lr_ratio: 0.0
    distributed.mode: decentralized
    distributed.scheme: awc
    distributed.topology: one_peer_ring
    distributed.error_feedback_gamma: 0.0
    runtime.training_backend: packed
    runtime.execution_backend: gh200
    runtime.compile: auto
    runtime.cpu_affinity: none
    runtime.fused_optimizer: true
    runtime.amp: true
    evaluation.subset_blocks: 1024
    evaluation.batch_size: 128
    evaluation.seed: 12345
    launcher.partition: gpu
    launcher.gpu_type: nvidia_gh200_120gb
    launcher.time: '00:30:00'

seed_start: 42
screening_seeds: 1
phases:
  - name: learning-rate-and-decay
    initial_values:
      optimizer.beta1: 0.9
      optimizer.beta2: 0.996712898272925
    search:
      # All four historical confirmed winners used the central value, 2^-7.
      optimizer.lr:
        scale: power
        base: 2
        exponent_min: -9
        exponent_max: -5
        points: 5
      optimizer.weight_decay:
        scale: log
        min: 0.0125
        max: 0.2
        points: 5
    top_k: 3
  - name: betas
    search:
      # Drop exponent 1/16, the weakest point in all four initial screens.
      optimizer.beta1:
        scale: power
        base: 0.9
        exponent_scale: log
        exponent_min: 0.125
        exponent_max: 1
        points: 4
      # Exponents: 1/512, 1/128, 1/32, 1/8, 1/2.
      optimizer.beta2:
        scale: power
        base: 0.9
        exponent_scale: log
        exponent_min: 0.001953125
        exponent_max: 0.5
        points: 5
    top_k: 6
confirmation:
  seeds: 3
controller:
  max_jobs: 25
  jobs_per_allocation: 1
  max_retries: 2
  poll_seconds: 30
