# Seven-point beta2 grid: exponents 1/2, 1/8, 1/32, 1/128, 1/512, 1/2048, 1/8192.
# Full fresh study: 118 runs; use the extension campaign to reuse completed executions.
# Extension adds 12 screening runs and up to 12 confirmation runs.
base:
  configs:
  - ../../base.yaml
  - ../../models/20m.yaml
  - ../../setups/slurm-ddp.yaml
  - ../../setups/1gpu.yaml
  overrides:
    model.context_length: 512
    training.batch_tokens: 65536
    training.tokens_per_parameters: 40.0
    training.num_accumulation: 1
    training.data_reuse_factor: 1
    training.checkpoint_policy: none
    optimizer.name: adamw
    optimizer.grad_clip: 1.0
    lr_schedule.name: cosine
    lr_schedule.warmup_tokens_per_parameters: 3.0
    lr_schedule.min_lr_ratio: 0.0
    distributed.mode: ddp
    distributed.scheme: awc
    distributed.topology: complete
    distributed.error_feedback_gamma: 0.0
    runtime.training_backend: distributed
    runtime.execution_backend: gh200
    runtime.compile: auto
    runtime.cpu_affinity: none
    runtime.fused_optimizer: true
    runtime.amp: true
    evaluation.subset_blocks: 1024
    evaluation.batch_size: 128
    evaluation.seed: 12345
    launcher.partition: gpu
    launcher.gpu_type: nvidia_gh200_120gb
    launcher.time: 00:30:00
seed_start: 42
screening_seeds: 1
phases:
- name: learning-rate-and-decay
  initial_values:
    optimizer.beta1: 0.9
    optimizer.beta2: 0.996712898272925
  search:
    optimizer.lr:
      scale: power
      base: 2
      exponent_min: -9
      exponent_max: -5
      points: 5
    optimizer.weight_decay:
      scale: log
      min: 0.0125
      max: 0.2
      points: 5
  top_k: 3
- name: betas
  search:
    optimizer.beta1:
      scale: power
      base: 0.9
      exponent_scale: log
      exponent_min: 0.125
      exponent_max: 1
      points: 4
    optimizer.beta2:
      scale: power
      base: 0.9
      exponent_scale: log
      exponent_min: 0.0001220703125
      exponent_max: 0.5
      points: 7
  top_k: 6
confirmation:
  seeds: 3
controller:
  max_jobs: 25
  jobs_per_allocation: 1
  max_retries: 2
  poll_seconds: 30
