# Short 20M/C4 example based on tuning-example.yaml: exactly 10 jobs, no retries.
# Uses the existing site cache. Run from the repository root.
# Set launcher.environment_script to a working site environment before submitting.
base:
  configs: [base.yaml, 20m.yaml, slurm-ddp.yaml]
  overrides:
    data.cache_dir: /nobackup/proj/disk/naiss2024-23-12/personal/zesen/repo/tiny-llm/data/c4
    training.tokens_per_parameters: 1.0
    training.epoch_tokens_per_parameters: 0.5
    training.checkpoint_policy: none
    lr_schedule.warmup_steps: 20
    distributed.nodes: 1
    distributed.gpus_per_node: 2
    launcher.cpus_per_task: 32
    launcher.memory: 64G
    launcher.time: '00:10:00'
seed_start: 42
screening_seeds: 1
phases:
  - name: learning-rate-and-decay
    initial_values:
      optimizer.beta1: 0.9
    search:
      optimizer.lr:
        scale: power
        base: 10
        exponent_min: -4
        exponent_max: -3
        points: 2
      optimizer.weight_decay: [0.0, 0.1]
    top_k: 2
  - name: momentum
    search:
      optimizer.beta1: [0.85, 0.9, 0.95]
    top_k: 2
confirmation:
  seeds: 2
controller:
  max_jobs: 4
  max_retries: 0
  poll_seconds: 5
