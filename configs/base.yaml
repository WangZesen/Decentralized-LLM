model:
  vocab_size: 32000
  context_length: 1024
data:
  cache_dir: data/c4
  loader_mode: auto
  reader_threads: 4
  prefetch_batches: 8
  host_memory_mib: 2048
training:
  batch_tokens: 32768
  micro_batch_size: 8
  tokens_per_parameters: 20.0
  epoch_tokens_per_parameters: 0.5
  data_reuse_factor: 1
  checkpoint_policy: final
lr_schedule:
  name: cosine
  warmup_steps: 312
runtime:
  device: cuda
  amp: true
  compile: auto
  output_dir: runs/default
distributed:
  mode: ddp
  nodes: 1
  gpus_per_node: 1
  backend: nccl
  timeout_seconds: 300
  rendezvous_port: 29500
launcher:
  kind: local
