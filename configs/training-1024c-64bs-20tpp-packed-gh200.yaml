# One physical GH200 GPU; distributed geometry specifies logical workers.
model:
  context_length: 1024
training:
  batch_tokens: 65536
  tokens_per_parameters: 20.0
  epoch_tokens_per_parameters: 0.5
  num_accumulation: 1
  data_reuse_factor: 1
  checkpoint_policy: none
lr_schedule:
  name: cosine
  warmup_tokens_per_parameters: 1.0
  min_lr_ratio: 0.0
runtime:
  training_backend: packed
  execution_backend: gh200
  compile: auto
  compile_scope: model
  cpu_affinity: none
  cpu_threads: 8
  fused_optimizer: true
launcher:
  time: '00:45:00'
  network: null
  environment_overlays: []
