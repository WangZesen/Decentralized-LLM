# Run from the repository root. Prepare the shared cache first and set your SLURM partition.
base:
  configs: [base.yaml, 20m.yaml, slurm-ddp.yaml]
  overrides:
    training.checkpoint_policy: none
seed_start: 42
screening_seeds: 2
phases:
  - name: learning-rate-and-decay
    initial_values:
      optimizer.beta1: 0.9
    search:
      optimizer.lr:
        scale: power
        base: 10
        exponent_min: -4
        exponent_max: -2
        points: 5
      optimizer.weight_decay: [0.0, 0.1, 0.2]
    top_k: 2
  - name: momentum
    search:
      optimizer.beta1: [0.85, 0.9, 0.95]
    top_k: 2
confirmation:
  seeds: 5
controller:
  max_jobs: 50
  max_retries: 2
  poll_seconds: 30
