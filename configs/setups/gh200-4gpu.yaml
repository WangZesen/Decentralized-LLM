# Layer after base.yaml and a model preset; batching comes from training configs. Set walltime for the training budget.
# Explicit throughput recipe; numerical limitations: docs/gh200-performance.md.
runtime:
  execution_backend: gh200
  compile: true
  compile_cache_dir: .cache/compile
  cpu_affinity: exclusive
  cpu_threads: 8
distributed:
  nodes: 1
  gpus_per_node: 4
  backend: nccl
  timeout_seconds: 900
launcher:
  kind: slurm
  partition: gpu
  time: '00:15:00'
  network: null
  environment_overlays: []
