# Layer after base.yaml and a model preset; batching comes from training configs. See docs/a100-performance.md.
# Explicit fused execution; automatic selection retains its qualification rules.
runtime:
  execution_backend: a100
  compile: true
  compile_mode: default
  compile_cache_dir: .cache/compile
  projection_fusion: true
  fused_rope: auto
  sdpa_backend: auto
  cpu_affinity: none
  cpu_threads: 8
distributed:
  nodes: 1
  gpus_per_node: 8
  backend: nccl
  timeout_seconds: 900
launcher:
  kind: slurm
  partition: gpu
  time: '00:15:00'
  network: null
  environment_overlays: []
