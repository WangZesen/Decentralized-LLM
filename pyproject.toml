[project]
name = "decentralized-llm"
version = "0.1.0"
description = "Distributed Llama training with reproducible network-storage loading"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.30.0",
    "loguru==0.7.3",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "safetensors==0.8.0",
    "seaborn==0.13.2",
    "torch==2.14.0",
    "transformers==5.16.1",
]

[project.scripts]
decentralized-llm = "decentralized_llm.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright==1.1.414", "pytest==9.1.1", "ruff==0.16.6"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
reportMissingParameterType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-plugin-autoload"
markers = ["cuda: requires a CUDA GPU", "distributed: multiprocess CPU/Gloo integration"]
